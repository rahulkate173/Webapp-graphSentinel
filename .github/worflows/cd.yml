name: GraphSentinel CD

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-trigger:
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks] # Ensures broken code never triggers deployment
    steps:
      - name: Trigger Production Webhook
        run: |
          if [ -n "${{ secrets.DEPLOY_HOOK_URL }}" ]; then
            curl -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
            echo "Successfully triggered deployment hook."
          else
            echo "DEPLOY_HOOK_URL is not set. Skipping webhook trigger."
          fi